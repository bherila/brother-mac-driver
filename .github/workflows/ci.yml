name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Shellcheck
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck scripts/*.sh

      # PDF -> the system's rasteriser driven by our PPD -> our filter -> decode -> pixel compare.
      - name: End-to-end through the system filter chain
        run: scripts/e2e-test.sh

      # Builds the unsigned installer package too, and checks every ready-made job against its raster.
      - name: Build the hardware visit kit
        run: scripts/make-visit-kit.sh

      - uses: actions/upload-artifact@v4
        with:
          name: brother-mac-driver-pkg
          path: build/*.pkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: visit-kit
          path: build/visit-kit.zip
          if-no-files-found: error

  # Everything the other job cannot reach: the installer's real paths, cupsd loading the PPDs,
  # cupsd running the filter, and the uninstaller taking it all away again. The printer is a
  # listener on localhost, so this is the whole path except the hardware.
  print-system:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        run: swift build -c release

      - name: Install
        run: scripts/install.sh

      - name: The print system offers this driver
        run: |
          ls -l /Library/Printers/BrotherOSS/filter/rastertobrother
          # lpinfo asks cupsd for the drivers it has indexed, so this fails if cupsd cannot read
          # the PPDs or rejects them. cupsd rebuilds that index when the directory changes, which
          # is not instant, so give it a few seconds before believing the answer.
          scripts/wait-for-driver.sh present

      # The PPD under test is the one the installer put in /Library/Printers, selected by the model
      # name cupsd indexed — so a package that ships a stale or unreadable PPD fails here.
      - name: Print through every installed PPD into a fake printer
        run: |
          models="$(.build/release/pxltool ppd --out "$RUNNER_TEMP/ppds" | sed 's|.*/Brother-||; s|\.ppd$||')"
          echo "models: $models"
          for model in $models; do
            echo "::group::$model"
            MODEL="$model" PPD_SOURCE=installed scripts/test-queue.sh
            echo "::endgroup::"
          done

      # These use the generated PPD, which is the path a developer takes before installing.
      - name: Print with the options the print dialog can set
        run: |
          MODEL=MFC-9330CDW scripts/test-queue.sh -o BRCompression=DeltaRow -o ColorModel=Gray
          MODEL=MFC-9330CDW scripts/test-queue.sh -o Duplex=DuplexNoTumble -o InputSlot=Tray1
          MODEL=HL-2140-series scripts/test-queue.sh -o BRTonerSaveMode=ON -o PageSize=A4

      - name: Uninstall
        run: |
          scripts/uninstall.sh
          for path in /Library/Printers/BrotherOSS /Library/Printers/PPDs/Contents/Resources/Brother-MFC-9330CDW.ppd.gz; do
            if [[ -e "$path" ]]; then
              echo "uninstall left $path behind" >&2
              exit 1
            fi
          done
          scripts/wait-for-driver.sh absent
