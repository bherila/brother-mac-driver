name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Shellcheck
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck scripts/*.sh

      # PDF -> the system's rasteriser driven by our PPD -> our filter -> decode -> pixel compare.
      - name: End-to-end through the system filter chain
        run: scripts/e2e-test.sh

      - name: Build the installer package (unsigned)
        run: BUILD_DIR="$PWD/.build/release" scripts/make-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: brother-mac-driver-pkg
          path: build/*.pkg
          if-no-files-found: error
